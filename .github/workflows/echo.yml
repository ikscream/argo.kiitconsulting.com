name: build-echo

# Build the example echo image, push it to the S3-backed registry
# (registry.kiitconsulting.com -> Hetzner bucket kiit-registry), then write the
# new tag back into the GitOps manifests so Argo CD deploys it. This is the
# best-practice "trigger": CI commits to git, Argo CD reconciles — no direct
# calls to the Argo CD API.
#
# It runs on GitHub (the mirror) but writes to Forgejo (the source of truth):
# pushing the tag to GitHub would deploy nothing, because Argo CD no longer
# reads it, and the next mirror sync would erase the commit.
on:
  push:
    branches: [main]
    paths:
      - examples/echo/**
      - .github/workflows/echo.yml
  workflow_dispatch:

permissions:
  contents: read         # the tag write-back goes to Forgejo, not to GitHub

concurrency:
  group: build-echo
  cancel-in-progress: false

env:
  IMAGE: registry.kiitconsulting.com/echo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: registry.kiitconsulting.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: examples/echo
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Write image tag back to GitOps manifests
        env:
          FORGEJO_REMOTE: https://ikscream:${{ secrets.FORGEJO_TOKEN }}@git.kiitconsulting.com/ikscream/argo.kiitconsulting.com.git
        run: |
          cd manifests/echo
          sed -i -E "s#(newTag: ).*#\\1${{ steps.tag.outputs.sha }}#" kustomization.yaml
          cd -
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- manifests/echo/kustomization.yaml; then
            echo "tag unchanged, nothing to commit"
          else
            git add manifests/echo/kustomization.yaml
            git commit -m "chore(echo): deploy ${{ steps.tag.outputs.sha }} [skip ci]"
            # Push to Forgejo. The runner checked this repo out from the GitHub
            # mirror, so HEAD is whatever main was when the build started; if
            # Forgejo has moved since, this is refused rather than forced, and
            # the next build writes the tag again.
            git push "$FORGEJO_REMOTE" HEAD:main
          fi

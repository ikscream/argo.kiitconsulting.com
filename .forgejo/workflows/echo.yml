name: build-echo

# Build the example echo image, push it to the S3-backed registry
# (registry.kiitconsulting.com -> Hetzner bucket kiit-registry), then write the
# new tag back into the GitOps manifests so Argo CD deploys it. This is the
# best-practice "trigger": CI commits to git, Argo CD reconciles — no direct
# calls to the Argo CD API.
#
# It runs on the cluster's own Forgejo Actions runner (manifests/forgejo/
# runner.yaml) and writes the tag back to this repository in Forgejo — the same
# forge it was checked out from. Before 2026-08-25 it ran on GitHub's runners
# against the mirror, which meant CI built from a copy of the source of truth
# and stopped dead when the account's Actions minutes ran out.
on:
  push:
    branches: [main]
    paths:
      - examples/echo/**
      - .forgejo/workflows/echo.yml
  workflow_dispatch:

permissions:
  contents: read         # the write-back uses GITOPS_TOKEN, not the job token

concurrency:
  group: build-echo
  cancel-in-progress: false

env:
  IMAGE: registry.kiitconsulting.com/echo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: registry.kiitconsulting.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: examples/echo
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Write image tag back to GitOps manifests
        env:
          # Not FORGEJO_TOKEN: Forgejo refuses to store a secret whose name
          # begins FORGEJO_, GITEA_ or GITHUB_ ("invalid secret name"), so the
          # obvious name for this credential is the one it cannot have.
          FORGEJO_REMOTE: https://ikscream:${{ secrets.GITOPS_TOKEN }}@git.kiitconsulting.com/ikscream/argo.kiitconsulting.com.git
        run: |
          cd manifests/echo
          sed -i -E "s#(newTag: ).*#\\1${{ steps.tag.outputs.sha }}#" kustomization.yaml
          cd -
          git config user.name  "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@kiitconsulting.com"
          if git diff --quiet -- manifests/echo/kustomization.yaml; then
            echo "tag unchanged, nothing to commit"
          else
            git add manifests/echo/kustomization.yaml
            git commit -m "chore(echo): deploy ${{ steps.tag.outputs.sha }} [skip ci]"
            # HEAD is whatever main was when the build started; if main has
            # moved since, this is refused rather than forced, and the next
            # build writes the tag again.
            git push "$FORGEJO_REMOTE" HEAD:main
          fi

# Argo CD Notifications configuration. The argocd-notifications-controller
# (shipped with the Argo CD install) reads this ConfigMap and the
# argocd-notifications-secret (key `telegram-token`, set out-of-band from
# op://ai-skills/wq2n2roohzy3aqod22tecundri). The default subscription below
# sends every Application's deploy/sync/failure/health events to Telegram —
# no per-app annotations needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  context: |
    argocdUrl: https://argo.kiitconsulting.com

  service.telegram: |
    token: $telegram-token

  # ---- templates -----------------------------------------------------------
  template.app-deployed: |
    message: |
      🚀 {{.app.metadata.name}} deployed
      New version is running and Healthy.
      Sync: {{.app.status.sync.status}} · Health: {{.app.status.health.status}}
      Revision: {{.app.status.sync.revision}}
      {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.app-sync-succeeded: |
    message: |
      ✅ {{.app.metadata.name}} sync succeeded
      Health: {{.app.status.health.status}}
      Revision: {{.app.status.sync.revision}}
      {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.app-sync-failed: |
    message: |
      ❌ {{.app.metadata.name}} sync FAILED
      {{.app.status.operationState.message}}
      {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.app-health-degraded: |
    message: |
      🔥 {{.app.metadata.name}} is DEGRADED
      Health: {{.app.status.health.status}}
      {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  template.app-sync-status-unknown: |
    message: |
      ❔ {{.app.metadata.name}} sync status is Unknown
      {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  # ---- triggers ------------------------------------------------------------
  trigger.on-deployed: |
    - description: Application is synced and healthy
      oncePer: app.status.sync.revision
      send: [app-deployed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'

  trigger.on-sync-succeeded: |
    - description: Application syncing has succeeded
      send: [app-sync-succeeded]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']

  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send: [app-sync-failed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']

  trigger.on-health-degraded: |
    - description: Application has degraded
      send: [app-health-degraded]
      when: app.status.health.status == 'Degraded'

  trigger.on-sync-status-unknown: |
    - description: Application status is 'Unknown'
      send: [app-sync-status-unknown]
      when: app.status.sync.status == 'Unknown'

  # ---- default subscription (all apps -> Telegram) -------------------------
  subscriptions: |
    - recipients:
        - telegram:194219638
      triggers:
        - on-deployed
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
        - on-sync-status-unknown

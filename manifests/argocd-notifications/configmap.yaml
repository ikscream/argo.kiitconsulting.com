# Argo CD Notifications configuration. The argocd-notifications-controller
# (shipped with the Argo CD install) reads this ConfigMap and the
# argocd-notifications-secret (key `telegram-token`, set out-of-band from
# op://ai-skills/wq2n2roohzy3aqod22tecundri).
#
# We use a *webhook* service (not the built-in `telegram` one): Argo CD's
# telebot-based telegram notifier returns "chat not found" for private-user
# chats, so we POST to the Telegram Bot API directly. The default subscription
# sends every Application's deploy/sync/failure/health events — no per-app
# annotations needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  context: |
    argocdUrl: https://argo.kiitconsulting.com

  # Webhook -> Telegram Bot API sendMessage. $telegram-token comes from the secret.
  service.webhook.telegram: |
    url: https://api.telegram.org/bot$telegram-token/sendMessage
    headers:
      - name: Content-Type
        value: application/json

  # ---- templates (JSON bodies; text built with printf | toJson so newlines and
  #      special characters are always safely escaped) ------------------------
  template.app-deployed: |
    webhook:
      telegram:
        method: POST
        body: |
          {"chat_id": 194219638, "disable_web_page_preview": true, "text": {{ (printf "🚀 %s deployed\nNew version is running and Healthy.\nSync: %s · Health: %s\nRevision: %s\n%s/applications/%s" .app.metadata.name .app.status.sync.status .app.status.health.status .app.status.sync.revision .context.argocdUrl .app.metadata.name) | toJson }} }

  template.app-sync-succeeded: |
    webhook:
      telegram:
        method: POST
        body: |
          {"chat_id": 194219638, "disable_web_page_preview": true, "text": {{ (printf "✅ %s sync succeeded\nHealth: %s\nRevision: %s\n%s/applications/%s" .app.metadata.name .app.status.health.status .app.status.sync.revision .context.argocdUrl .app.metadata.name) | toJson }} }

  template.app-sync-failed: |
    webhook:
      telegram:
        method: POST
        body: |
          {"chat_id": 194219638, "disable_web_page_preview": true, "text": {{ (printf "❌ %s sync FAILED\n%s\n%s/applications/%s" .app.metadata.name .app.status.operationState.message .context.argocdUrl .app.metadata.name) | toJson }} }

  template.app-health-degraded: |
    webhook:
      telegram:
        method: POST
        body: |
          {"chat_id": 194219638, "disable_web_page_preview": true, "text": {{ (printf "🔥 %s is DEGRADED\nHealth: %s\n%s/applications/%s" .app.metadata.name .app.status.health.status .context.argocdUrl .app.metadata.name) | toJson }} }

  template.app-sync-status-unknown: |
    webhook:
      telegram:
        method: POST
        body: |
          {"chat_id": 194219638, "disable_web_page_preview": true, "text": {{ (printf "❔ %s sync status is Unknown\n%s/applications/%s" .app.metadata.name .context.argocdUrl .app.metadata.name) | toJson }} }

  # ---- triggers ------------------------------------------------------------
  trigger.on-deployed: |
    - description: Application is synced and healthy
      oncePer: app.status.sync.revision
      send: [app-deployed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'

  trigger.on-sync-succeeded: |
    - description: Application syncing has succeeded
      send: [app-sync-succeeded]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']

  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send: [app-sync-failed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']

  trigger.on-health-degraded: |
    - description: Application has degraded
      send: [app-health-degraded]
      when: app.status.health.status == 'Degraded'

  trigger.on-sync-status-unknown: |
    - description: Application status is 'Unknown'
      send: [app-sync-status-unknown]
      when: app.status.sync.status == 'Unknown'

  # ---- default subscription (all apps -> Telegram webhook) -----------------
  # Failures/degradation only — the actionable events. Success/deploy pings are
  # intentionally NOT subscribed: with app-of-apps GitOps every commit (incl.
  # unrelated CI image-tag write-backs) bumps the tracked revision for ALL apps,
  # so on-deployed/on-sync-succeeded re-fire for every app on every push = spam.
  # The on-deployed/on-sync-succeeded templates+triggers are still defined above,
  # so you can re-subscribe (ideally per-app via annotation) if you want them.
  subscriptions: |
    - recipients:
        - telegram
      triggers:
        - on-sync-failed
        - on-health-degraded
        - on-sync-status-unknown

# Forgejo's entire state: SQLite database, git repositories, LFS, avatars and
# app.ini (the rootless image keeps config at custom/conf/app.ini inside here).
#
# Backed by the dedicated 70 GB Hetzner volume (pv.yaml), not the node's root
# disk — the repositories are what this forge exists to keep, and the root disk
# has ~12 GB free. `volumeName` binds this claim to that one PV explicitly.
#
# It is still a single copy — Hetzner volumes have no snapshots and server
# backups image only the root disk. What covers it is backup.yaml: a nightly
# `forgejo dump` encrypted into the Hetzner bucket, which is the only copy of
# users, tokens, issues and PRs (the GitHub push mirror covers commits alone).
# See docs/forgejo.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hcloud-volume
  volumeName: forgejo-data-hcv
  resources:
    requests:
      storage: 68Gi

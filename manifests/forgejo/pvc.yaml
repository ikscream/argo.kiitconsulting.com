# Forgejo's entire state: SQLite database, git repositories, LFS, avatars and
# app.ini (the rootless image keeps config at custom/conf/app.ini inside here).
#
# Backed by the dedicated 70 GB Hetzner volume (pv.yaml), not the node's root
# disk — the repositories are what this forge exists to keep, and the root disk
# has ~12 GB free. `volumeName` binds this claim to that one PV explicitly.
#
# Still NOT backed up: the volume outlives the pod and is independent of the
# root disk, but it is a single copy. The push mirror to GitHub is the off-box
# copy of the git history; users, tokens and issues have none. See
# docs/forgejo.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hcloud-volume
  volumeName: forgejo-data-hcv
  resources:
    requests:
      storage: 68Gi

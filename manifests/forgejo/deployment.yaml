# Forgejo — the GitOps source of truth Argo CD reconciles from.
#
# Single replica + Recreate: the PVC is RWO and SQLite tolerates exactly one
# writer, so two overlapping pods would either fail to mount or corrupt the DB.
#
# Config comes from FORGEJO__<section>__<KEY> env vars, which the entrypoint
# renders into app.ini on every start. app.ini lives on the PVC, so values
# Forgejo generates itself (SECRET_KEY, INTERNAL_TOKEN) survive restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        # The volume's gitea/ dir is pre-chowned to 1000:1000 on the node, so
        # OnRootMismatch makes the fsGroup pass a no-op instead of a recursive
        # chown of every git object.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: forgejo
          image: registry.kiitconsulting.com/forgejo:16.0.3-kiit.1@sha256:36993dd5e78de4ba0408226929dc88f4a6281673bcb51dd383c87bac400d2c1c
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: FORGEJO__server__PROTOCOL
              value: http
            - name: FORGEJO__server__HTTP_ADDR
              value: 0.0.0.0
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__ROOT_URL
              value: https://git.kiitconsulting.com/
            - name: FORGEJO__server__DOMAIN
              value: git.kiitconsulting.com
            # No SSH: port 22 on the node is the host's own sshd, and exposing
            # the built-in server would need a NodePort + firewall change.
            # Clone over HTTPS with a token instead.
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "false"
            - name: FORGEJO__server__LFS_START_SERVER
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__database__PATH
              value: /var/lib/gitea/data/forgejo.db
            - name: FORGEJO__repository__REQUIRE_SIGNED_COMMITS
              value: "true"
            - name: FORGEJO__repository__SIGNATURE_ALLOWED_SIGNERS
              value: /etc/forgejo-signature-policy/allowed_signers
            - name: FORGEJO__repository_0X2E_signing__FORMAT
              value: ssh
            - name: FORGEJO__repository_0X2E_signing__SIGNING_KEY
              value: /etc/forgejo-signing-key/signing_key.pub
            - name: FORGEJO__repository_0X2E_signing__SIGNING_NAME
              value: KIIT Forgejo
            - name: FORGEJO__repository_0X2E_signing__SIGNING_EMAIL
              value: forgejo@git.kiitconsulting.com
            - name: FORGEJO__repository_0X2E_signing__DEFAULT_TRUST_MODEL
              value: committer
            - name: FORGEJO__repository_0X2E_signing__INITIAL_COMMIT
              value: always
            - name: FORGEJO__repository_0X2E_signing__WIKI
              value: always
            - name: FORGEJO__repository_0X2E_signing__CRUD_ACTIONS
              value: always
            - name: FORGEJO__repository_0X2E_signing__MERGES
              value: always
            # Skip the web installer; this is a config-managed instance.
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            # Private forge: anonymous visitors get the login page, not the repos.
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            # CI runs here now, on the runner in runner.yaml. Builds left
            # GitHub's runners when the account's Actions minutes ran out and
            # took every image build with them — and reaching them at all meant
            # depending on a mirror of this repo rather than this repo.
            - name: FORGEJO__actions__ENABLED
              value: "true"
            # Where a bare `uses: actions/checkout@v7` is resolved from. The
            # default is code.forgejo.org, which carries forks of the `actions/*`
            # set but nothing else — and the migrated workflows also use
            # `docker/*` and `cloudflare/*`. Pointing at GitHub keeps every
            # `uses:` line resolvable without rewriting it into a URL.
            - name: FORGEJO__actions__DEFAULT_ACTIONS_URL
              value: https://github.com
            - name: FORGEJO__log__LEVEL
              value: info
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            # First boot runs the schema migrations against an empty SQLite file.
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: signature-policy
              mountPath: /etc/forgejo-signature-policy
              readOnly: true
            - name: signing-key
              mountPath: /etc/forgejo-signing-key
              readOnly: true
      imagePullSecrets:
        - name: registry-pull
      volumes:
        - name: signature-policy
          configMap:
            name: forgejo-signature-policy
        - name: signing-key
          secret:
            secretName: forgejo-instance-signing
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data

apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          # Pinned by DIGEST, not by tag, and `registry:3` is why. On 2026-10-12 that tag
          # resolved to sha256:ddf75434 (3.1.2, built 2026-09-24) while the pod had been running
          # sha256:1be55279 since it was first pulled — a 2026-06-22 build that corresponds to no
          # current tag at all. Nothing was wrong and nothing had changed in git; the tag simply
          # moved under a cluster whose imagePullPolicy is IfNotPresent, and after that nobody
          # could say what was running without resolving a digest by hand. A digest cannot move.
          #
          # This bump also carries two CVEs: 3.1.2 verifies manifest and blob content against the
          # requested digest (CVE-2026-85747) and fixes S3 tag pagination and catalog listing when
          # one repository name is a prefix of another — this registry runs the S3 driver, so both
          # of those are ours. 3.1.1 fixed CVE-2026-41888 on the way past.
          #
          # To move it: pick the tag, resolve its list digest (`docker buildx imagetools inspect
          # registry:<tag>`, or the Docker Hub tags API), and write BOTH here — the tag is for a
          # human reading the diff, the digest is what is enforced.
          image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          args: ["serve", "/etc/distribution/config.yml"]
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the S3 storage driver.
            # Secret is created out-of-band from op://ai-skills/hetzner/s3.
            - secretRef:
                name: registry-s3
          env:
            - name: AWS_REGION
              value: fsn1
          volumeMounts:
            - name: config
              mountPath: /etc/distribution/config.yml
              subPath: config.yml
            - name: auth
              mountPath: /auth
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: registry-config
        - name: auth
          secret:
            secretName: registry-auth

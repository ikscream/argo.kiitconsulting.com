apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
data:
  config.yml: |
    version: 0.1
    log:
      level: info
    storage:
      cache:
        blobdescriptor: inmemory
      s3:
        # Credentials come from the AWS_* env vars (Secret registry-s3), not here.
        region: fsn1
        regionendpoint: https://fsn1.your-objectstorage.com
        bucket: kiit-registry
        rootdirectory: /
      delete:
        enabled: true
      maintenance:
        uploadpurging:
          enabled: false
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    auth:
      htpasswd:
        realm: "kiit registry"
        path: /auth/htpasswd
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3

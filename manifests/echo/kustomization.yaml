apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No Ingress on purpose. echo was published at https://echo.kiitconsulting.com
# with no authentication of any kind until 2026-10-01 — a demo app answering the
# open internet from the production node, and the one service here that reflects
# arbitrary request headers straight back to the caller. The Deployment and
# Service stay, so it is still a valid CI target (build → registry → newTag
# write-back → Argo CD sync) and still reachable in-cluster:
#   kubectl -n echo run t --rm -i --image=curlimages/curl:8.11.1 -- -s http://echo/
# To publish it again, restore ingress.yaml from git history and re-add the A record.
resources:
  - deployment.yaml
  - service.yaml
# The CI workflow (.github/workflows/echo.yml) rewrites newTag on each build and
# commits it back — this line is the GitOps deploy trigger. Do not hand-edit.
images:
  - name: registry.kiitconsulting.com/echo
    newTag: b0f0aef

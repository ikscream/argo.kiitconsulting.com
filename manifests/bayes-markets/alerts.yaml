# What is worth waking somebody for, in this project's own terms.
#
# **The 35 rules that came with kube-prometheus-stack are about Kubernetes.**
# They catch a pod crash-looping, a disk filling, a node under memory pressure -
# all real, none of them about whether this site is doing its job. A steward that
# is Running and Ready but has not completed a pass in ten minutes is invisible
# to every one of them, and it is exactly the failure this estate has had before:
# the recorder was alive and not working for four days, and `markets: 0` is the
# healthy answer four ticks in five, so nothing looked wrong.
#
# So these five ask the question the product cares about: is the tape being
# collected, is the money loop running, can a reader reach the site.
#
# They go to Telegram through the Alertmanager added on 2026-09-12 - the same
# @kiitconsulting_bot chat that reports failed Argo CD syncs, deliberately not
# the product's own bot.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bayes
  namespace: bayes
  labels:
    app: bayes
spec:
  groups:
    - name: bayes.product
      # Half the scrape interval of the slowest thing here; these are all
      # "has it stopped" questions, not spikes.
      interval: 30s
      rules:
        # **The site, as a reader meets it.** Not "is the pod running" - ready
        # replicas, because a pod that cannot reach the database is Running and
        # useless. Two minutes, so an ordinary rollout does not page anybody.
        - alert: BayesSiteDown
          expr: kube_deployment_status_replicas_ready{namespace="bayes",deployment="web"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No web pod is ready
            description: bayes.markets has no pod able to serve. Every request is a 502.

        # **Nobody is collecting the tape.** The Chainlink stream has no history
        # endpoint, so a minute not collected is a minute that cannot be
        # recovered from anywhere - this is data loss in progress, not a warning.
        - alert: BayesTapeStopped
          expr: max(bayes_ingest_leader) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No ingest pod holds the writer lease
            description: The price tape is not being recorded, and an aged-out minute cannot be re-fetched.

        # **Alive and working are different claims.** If the steward's last
        # completed pass is half an hour old the process is up and the work is
        # not being done - which is what the page promises readers and cannot see
        # for itself.
        #
        # **The threshold has to be a multiple of STEWARD_WATCH_MS, not equal to
        # it.** This said 600000 while the loop ran every ten seconds, which was
        # sixty passes of headroom. The loop now runs every ten MINUTES, because
        # deposits and settlements arrive on Redis instead of being polled for -
        # so 600000 would have gone critical in the gap before every single pass.
        # 1800000 is two missed passes. Corrected 2026-09-17, in the same change
        # that lengthened the interval.
        - alert: BayesStewardStalled
          expr: (time() * 1000 - bayes_steward_last_pass_at) > 1800000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The steward has not completed a pass in half an hour
            description: Claims and conversions are not happening for delegated readers, and the account page is describing work nobody is doing.

        # **Messages piling up unsent.** One pending row is the normal state for
        # a few seconds after a trade; twenty for a quarter of an hour means the
        # sender is stuck, and a reader is being told nothing about their money.
        - alert: BayesNotificationsStuck
          expr: max(bayes_notify_outbox_rows{state="pending"}) > 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Telegram messages are queued and not going out
            description: The notify outbox has more than twenty pending rows. Readers are not being told about their own trades.

        # **The primary Polygon RPC refusing, which is invisible by design.**
        # Measured 2026-09-17: QuickNode answered HTTP 429 "daily request limit
        # reached" for 7,374 of 9,057 calls over seven days, every one of them
        # silently served by the public-node fallback instead - so the site
        # stayed up, got slower, and nothing said a word. It was found because a
        # person went looking.
        #
        # The fallback is what makes this a warning rather than an outage, and
        # also what makes it worth an alert: the free public node has no quota to
        # run out of but throttles at about fifteen concurrent calls, so running
        # on it permanently is one busy minute away from dashes on the account
        # page.
        #
        # **The label is `upstream`, and it was `endpoint`, which is why this
        # rule never fired.** A PodMonitor attaches its own `endpoint` label -
        # the scrape port, `http` or `metrics` - so Prometheus renamed ours to
        # `exported_endpoint` without a word. `{endpoint="quicknode"}` matched
        # nothing at all while QuickNode was refusing 100% of calls, and the same
        # collision made five panels on the upstreams dashboard group by the port
        # name. Found 2026-09-17 by asking why this alert was inactive when the
        # thing it watches for was happening. The metric is renamed in
        # src/metrics.js and this rule follows it.
        - alert: BayesPrimaryRpcRefusing
          expr: |
            sum(rate(bayes_upstream_calls_total{upstream="quicknode",outcome!="ok"}[15m]))
              / clamp_min(sum(rate(bayes_upstream_calls_total{upstream="quicknode"}[15m])), 0.001) > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: QuickNode is refusing more than half the calls
            description: Polygon reads are falling back to the free public node. Check the daily quota first - a 429 here reads as "daily request limit reached".

        # **A pod that stopped answering its own metrics endpoint**, which is the
        # cheapest honest proxy for "this service is not there". Scoped to this
        # namespace so it says something about the product rather than the
        # cluster.
        - alert: BayesServiceDown
          expr: up{job=~"bayes/.*"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} is not answering"
            description: "Prometheus cannot scrape {{ $labels.pod }}. It is either gone or wedged."

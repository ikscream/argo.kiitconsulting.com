# ingest: one Hyperliquid socket, one writer, and the BTC tape it keeps.
#
# No longer a placeholder. It holds the socket the site's rounds settle on, writes
# every BTC fill into hourly partitions in PostgreSQL, keeps the 5m candle
# corrected against the exchange's own record, and publishes a tick a second to
# Redis for the web pods to fan out. Source lives with the product, in
# ikscream/prj-bayes-markets under services/ingest.
#
# **A StatefulSet, because one socket is the whole design.** A Deployment rolls by
# starting the new pod before stopping the old one, so every rollout would have two
# pods overlapping for a few seconds - two upstream sockets and two writers. A
# StatefulSet with one replica terminates the old pod first. It carries no volume
# and wants no stable storage: the identity is the point here, not the disk.
#
# **The Lease is the other half, and it is not ceremony.** replicas: 1 survives a
# rollout; it does not survive `kubectl scale --replicas=2`, a copy of the image
# run by hand against this database, or two revisions racing after a rollback. The
# pod holds `lease/ingest-writer` and opens the socket only while it holds it, and
# it stops writing at its own deadline whether or not anything tells it to. See
# services/ingest/src/lease.js in the product repo for why that self-fencing is
# the half that cannot be left out.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest
  labels:
    app: ingest
---
# The narrowest permission that can express "one writer": read, create and renew
# ONE named Lease. No pod, node or secret access - the pod's identity is its own
# name, handed to it by the StatefulSet, and nothing here needs to look anything
# up in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingest-lease
  labels:
    app: ingest
rules:
  # `create` cannot be restricted to a resource name - the object does not exist
  # yet - so it is granted on leases in this namespace only.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["ingest-writer"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingest-lease
  labels:
    app: ingest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingest-lease
subjects:
  - kind: ServiceAccount
    name: ingest
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  type: ClusterIP
  selector:
    app: ingest
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The governing Service a StatefulSet requires, and deliberately not the one
# above: this one is headless, so the pod gets a stable DNS name, and it publishes
# unready addresses - a pod that cannot reach PostgreSQL is exactly the pod you
# want to be able to curl for the reason.
apiVersion: v1
kind: Service
metadata:
  name: ingest-headless
  labels:
    app: ingest
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: ingest
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  serviceName: ingest-headless
  # One, and the Lease is what makes it a guarantee rather than a hope. Raising it
  # does not scale ingest: the second pod would sit as a follower holding no socket
  # and writing nothing, which is the correct behaviour and not a useful one.
  replicas: 1
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
      # Prometheus scrape of the collector's /metrics, so the live Up/Down price
      # feed's health (per-interval freshness, availability, consecutive fails)
      # can be alerted on. Harmless where the scrape is by ServiceMonitor instead;
      # the endpoint answers either way.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: ingest
      # The registry is private basic-auth, so without this the kubelet gets a
      # 401 and the pod sits in ImagePullBackOff. Created out-of-band from
      # 1Password - see docs/ci-cd.md.
      imagePullSecrets:
        - name: registry-pull
      # Enough to flush the last batch and let the socket go. The lease is
      # released by expiry rather than by deletion, so a pod killed outright costs
      # the next one a 15-second wait before it may start collecting.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca
        # Written once at start and read by the process. Memory-backed and gone
        # with the pod, because it is derived from two things that are already
        # mounted.
        - name: ca-bundle
          emptyDir: {}
      initContainers:
        # `cat`, because that is all it is. The same image as the container, so
        # there is nothing extra to pull and nothing extra to keep patched.
        - name: ca-bundle
          image: registry.kiitconsulting.com/bayes-ingest:latest
          command:
            - sh
            - -c
            - cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /etc/ssl/rds/eu-north-1.pem > /etc/ssl/ca-bundle/ca.pem
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/ssl/rds
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ssl/ca-bundle
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: ingest
          image: registry.kiitconsulting.com/bayes-ingest:latest
          ports:
            - name: http
              containerPort: 8080
          # **Where the database is, said once for the whole estate.** This was
          # four env entries repeated in seven files, which is seven places to
          # edit for one move and six chances to miss one. `bayes-db` carries the
          # host, the port, the user, the database and the TLS settings. The
          # password stays a Secret reference below, where it belongs.
          envFrom:
            - configMapRef:
                name: bayes-db
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayes-postgres
                  key: password
            - name: REDIS_URL
              value: redis://redis:6379
            # The lease holder's name. Taken from the pod, so it is `ingest-0` and
            # `kubectl get lease` names the holder - "the pod" would stop being an
            # answer the moment there were two.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # How long the tape is kept. Until the tiering CronJob and its S3
            # bucket exist there is no copy anywhere else, so this is the age at
            # which history is destroyed, not a cache expiry. Measured on disk:
            # 108 bytes a row, so ~70 MB a day and ~490 MB for the seven-day
            # window, against the 5Gi volume PostgreSQL has. Seven days so the
            # longer chart intervals (4h, and 1h/1d once Binance lands) have the
            # history to draw; the Binance daily table keeps forty days of its own.
            - name: RETENTION_HOURS
              value: "168"
            # **Two certificate authorities, one file, because Node takes one
            # path.** This process is the only one here that speaks TLS to two
            # places that AREN'T on the public internet: the Kubernetes API for
            # the Lease, signed by the cluster CA, and RDS, signed by Amazon's
            # RDS root. `NODE_EXTRA_CA_CERTS` names a single file, so pointing it
            # at either one breaks the other - measured 2026-09-12, when pointing
            # it at the cluster CA left every lease tick failing with
            # "self-signed certificate in certificate chain" from the DATABASE.
            # The init container below concatenates them at start, which is also
            # why the cluster CA is not a file in git: it is whatever this pod is
            # handed, so rebuilding the cluster cannot leave a stale copy behind.
            #
            # This overrides the value from the `bayes-db` ConfigMap on purpose;
            # container `env` wins over `envFrom`, and every other workload wants
            # the RDS bundle alone.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/ca-bundle/ca.pem
          # Liveness asks only whether the process is alive. Pointing it at the
          # dependency check instead would restart a healthy pod every time
          # PostgreSQL blinked, turning a short outage into a crash loop - and
          # pointing it at the upstream socket would hand Hyperliquid the power to
          # restart this pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Readiness does ask, so a pod that cannot see its dependencies is
          # pulled from the Service and says why in `kubectl describe`. It does
          # NOT ask about the lease: a follower is a correct standby.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            # Raised from the placeholder's 128Mi: this one holds a batch buffer
            # (bounded at 50,000 fills) and a pool of four PostgreSQL connections.
            # The headroom is for an unreachable database, which is exactly when
            # an OOMKill would cost the most.
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            # Amazon's RDS root, which is NOT in Node's built-in trust store. Without
            # it the driver refuses the connection with "self-signed certificate in
            # certificate chain" - measured against the live instance, 2026-09-12.
            - name: rds-ca
              mountPath: /etc/ssl/rds
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ssl/ca-bundle
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

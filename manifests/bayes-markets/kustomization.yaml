apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - redis.yaml
  - ingest.yaml
  - podmonitor.yaml
  - ingress.yaml
  - web.yaml
  - recorder.yaml
  - log-export.yaml
  - notifier.yaml
  - telegram-sender.yaml
  - steward.yaml
# CI in ikscream/prj-bayes-markets rewrites these tags after each build and commits
# the result back here - the commit is the deploy trigger. Do not hand-edit.
# `.github/workflows/ingest.yml` owns the bayes-ingest entry and
# `.github/workflows/web.yml` owns bayes-web; each selects its own entry BY NAME
# with `yq`, because a line-oriented rewrite would stamp one service's sha onto
# the other's image and report a deploy of a container that was never built.
#
# Both start at a real tag rather than `latest`, so what is running is always
# nameable. The quotes are load-bearing: a short sha is hex, so about one in
# sixteen is all digits - 9181092 was - and unquoted YAML reads that as a number,
# which fails the whole build with "cannot unmarshal number into Go struct field
# Image.images.newTag of type string". Argo CD then cannot compare any resource in
# this directory, so postgres and redis stop being reconciled too, and the app
# reports Healthy while deploying nothing.
# ── Where the database is, and how to trust it ─────────────────────────────
#
# **One place, because it used to be seven.** `PGHOST` was four env entries
# repeated in every workload that talks to PostgreSQL, so moving the database
# meant seven identical edits and six chances to miss one. It is now this
# ConfigMap, pulled in with `envFrom` - and the move itself, in-cluster to RDS,
# was one line here.
#
# **The generated name carries a hash**, which is the point: change a value and
# kustomize makes a new ConfigMap and rewrites every reference to it, so the
# pods roll onto the new setting instead of keeping the old one until somebody
# notices. A plain ConfigMap edit changes nothing that is already running.
configMapGenerator:
  - name: bayes-db
    literals:
      # The RDS instance in the same VPC and the same availability zone as the
      # node, reachable only from the node's security group. It used to be
      # `postgres`, the in-cluster StatefulSet, whose disk held the only copy of
      # who the readers are and had no backup of any kind.
      - PGHOST=bayes-stockholm.c1qa2cqui0gk.eu-north-1.rds.amazonaws.com
      - PGPORT=5432
      - PGUSER=bayes
      - PGDATABASE=bayes
      # **RDS refuses an unencrypted connection** - `sslmode=disable` answers
      # "no pg_hba.conf entry ... no encryption". `require` makes node-postgres
      # verify the chain, which needs the certificate below.
      - PGSSLMODE=require
      # Node reads this at STARTUP and adds the file to its trust store; setting
      # it inside a process is too late. Amazon's RDS roots are not in the
      # built-in store, so without this every connection fails with
      # "self-signed certificate in certificate chain".
      - NODE_EXTRA_CA_CERTS=/etc/ssl/rds/eu-north-1.pem
  # The three Amazon RDS roots for eu-north-1, fetched from
  # truststore.pki.rds.amazonaws.com. Mounted read-only at /etc/ssl/rds in every
  # workload that opens a connection.
  - name: rds-ca
    files:
      - eu-north-1.pem=rds-eu-north-1.pem
images:
  - name: registry.kiitconsulting.com/bayes-ingest
    newTag: "1aa1757"
  - name: registry.kiitconsulting.com/bayes-web
    newTag: "5db8b0b"

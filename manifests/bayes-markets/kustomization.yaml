apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - redis.yaml
  - ingest.yaml
  - podmonitor.yaml
  - ingress.yaml
  - web.yaml
  - recorder.yaml
  - log-export.yaml
# CI in ikscream/prj-bayes-markets rewrites these tags after each build and commits
# the result back here - the commit is the deploy trigger. Do not hand-edit.
# `.github/workflows/ingest.yml` owns the bayes-ingest entry and
# `.github/workflows/web.yml` owns bayes-web; each selects its own entry BY NAME
# with `yq`, because a line-oriented rewrite would stamp one service's sha onto
# the other's image and report a deploy of a container that was never built.
#
# Both start at a real tag rather than `latest`, so what is running is always
# nameable. The quotes are load-bearing: a short sha is hex, so about one in
# sixteen is all digits - 9181092 was - and unquoted YAML reads that as a number,
# which fails the whole build with "cannot unmarshal number into Go struct field
# Image.images.newTag of type string". Argo CD then cannot compare any resource in
# this directory, so postgres and redis stop being reconciled too, and the app
# reports Healthy while deploying nothing.
images:
  - name: registry.kiitconsulting.com/bayes-ingest
    newTag: "75e70d8"
  - name: registry.kiitconsulting.com/bayes-web
    newTag: "fd5aac7"

# ap.kiitconsulting.com is a **proxied (orange-cloud)** A record at the node IP, and it must
# stay that way: Cloudflare Access only enforces on traffic that reaches the edge, so flipping
# this record back to grey silently removes the SSO login. Certs are unaffected — the
# letsencrypt-prod ClusterIssuer uses the DNS-01 solver, which needs no inbound HTTP.
# See docs/cloudflare-access-sso.md.
#
# Traefik proxies WebSockets transparently, so /ws (browsers) and /dispatch
# (dispatchers) need no annotation of their own. Both are long-lived connections;
# the portal sends its own 20s ping/pong keepalive, which is what should keep them
# under any idle timeout on the entrypoint. Both are Access **bypass** apps: a login
# redirect is not something a WebSocket upgrade can follow, and both paths carry their
# own token gates instead (see docs/cloudflare-access-sso.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-portal
  labels:
    app: ai-portal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: ap.kiitconsulting.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-portal
                port:
                  number: 80
  tls:
    - hosts:
        - ap.kiitconsulting.com
      secretName: ai-portal-tls

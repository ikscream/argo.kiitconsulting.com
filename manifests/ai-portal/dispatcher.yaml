# ai-portal dispatcher — the half that actually runs Claude Code. The portal next to it is
# a control plane and runs no engine: it holds auth, the host registry and the history, and
# routes prompts over the `/dispatch` WebSocket to whichever dispatcher registered the host.
# Source is ikscream/ai-portal-v2 (same repo, same image build, different entrypoint).
#
# **It dials the portal, not the other way round.** The connection is outbound to the
# in-cluster Service, so nothing here is published, no Ingress exists, and the Cloudflare
# Access gate in front of `ap.kiitconsulting.com` is never in the path. The only credential
# is the Bearer DISPATCH_TOKEN below, which both halves read from the same Secret — the
# portal's `bearerOk()` fails closed when it is unset, which is what kept /dispatch refusing
# every connection until now.
#
# **One replica, and the old pod must be gone before the new one starts.** A dispatcher
# registers a host id, and the portal keeps `dispatchers` as a last-writer-wins Map keyed by
# that id. Overlap two pods and the second registers, then the first's socket closes and
# deletes the live entry — the host is pinned `connected:false` while a perfectly healthy
# dispatcher keeps answering heartbeats next door. That is a real bug v1 hit on its
# tunnel-connected host, and RollingUpdate would reproduce it on every deploy. Hence
# `Recreate`; the RWO volumes below could not be shared anyway.
#
# **AGENT_MODE=job: each prompt runs in its own Kubernetes Job.** v1's fleet runs each prompt
# in a hardened ephemeral sibling container spawned through the host's docker socket; k3s runs
# containerd and has no docker socket to mount, so a Job is that shape's native equivalent.
# This pod creates the Job, the runner inside it dials back over the agent-channel Service
# below, and the pod reaps itself on its TTL. What it changes versus the `inprocess` mode this
# ran until now — where an agent was a `query()` in THIS process:
#   - an agent that OOMs takes its own pod, not the dispatcher and every live session with it;
#   - its CPU/memory limits are its own (AGENT_JOB_*), not this pod's;
#   - and, the reason it was built, the agent has its OWN NETWORK NAMESPACE — which is what
#     lets a per-project tailnet be a boundary enforced by NetworkPolicy instead of a SOCKS
#     proxy on a localhost every agent shared.
# Unchanged: background work an agent starts still dies with its run, and the agent's sandbox
# is still a container security context rather than a VM.
#
# This mode is inert without the Role in rbac.yaml — every API call comes back 403, which
# surfaces at boot as "could not reap orphan agent Jobs" and then as a first prompt that never
# starts. The two ship together for that reason. It is equally inert on an image that predates
# the job path: an older dispatcher does not recognise the mode and quietly stays in-process,
# so the tag in kustomization.yaml is part of this change, not a follow-up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-portal-dispatcher-state
  labels:
    app: ai-portal-dispatcher
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# The project tree agents work in, kept separate from the dispatcher's own state so a repo
# can be wiped without losing the session map (which is what resume depends on).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-portal-workspace
  labels:
    app: ai-portal-dispatcher
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-portal-dispatcher
  labels:
    app: ai-portal-dispatcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-portal-dispatcher
  template:
    metadata:
      labels:
        app: ai-portal-dispatcher
    spec:
      imagePullSecrets:
        - name: registry-pull
      # Not `default` any more: job mode is entirely API calls, and this is the identity they
      # are made with. See rbac.yaml for what it may and may not do.
      serviceAccountName: ai-portal-dispatcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # local-path hands over a root-owned directory; the image runs as `node` (1000).
        # Without this the dispatcher cannot write projects.json or the session map.
        fsGroup: 1000
      containers:
        - name: dispatcher
          image: registry.kiitconsulting.com/ai-portal-dispatcher:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # NOT readOnlyRootFilesystem: an agent legitimately writes to /tmp, and npm/uv/
            # the engine all write caches. The confinement that matters is the project dir,
            # which the dispatcher enforces itself.
          env:
            # In-cluster, so this never leaves the node and never meets Traefik, the edge,
            # or the Access gate. The Service listens on 80 and targets the portal's 8787.
            - name: PORTAL_URL
              value: ws://ai-portal.ai-portal.svc.cluster.local:80/dispatch
            - name: DISPATCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-portal-auth
                  key: DISPATCH_TOKEN
            # How this host is labelled in the portal's Hosts view and in every agentId
            # (`<host>::<project>`), so changing it orphans existing sessions.
            - name: HOST_ID
              value: k3s
            - name: AGENT_MODE
              value: job
            # No projects.json ships with the image, and the dispatcher falls back to a
            # single project rooted at BASE_DIRECTORY — which is also the confinement root
            # agents cannot escape. Projects added later in the UI are written here, so the
            # file has to live on the volume or every restart would forget them.
            - name: BASE_DIRECTORY
              value: /workspace
            - name: PROJECTS_FILE
              value: /state/projects.json
            # agentId -> Claude sessionId, which is what makes "continue" survive a restart.
            - name: SESSIONS_FILE
              value: /state/dispatcher-sessions.json
            # The engine writes its own transcripts and config under $HOME. The image points
            # it at /home/node, which is the container's ephemeral layer — put it on the
            # volume so a rollout doesn't discard the sessions the file above refers to.
            - name: HOME
              value: /state
            - name: CLAUDE_CONFIG_DIR
              value: /state/.claude
            # Subscription auth (no API key path exists). CLAUDE_ACCOUNTS is the pool this
            # host may run under, keyed by name; a project pins one with "account", and
            # CLAUDE_ACCOUNT names the default. Only the NAMES ever reach the portal.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-portal-claude
                  key: CLAUDE_CODE_OAUTH_TOKEN
            - name: CLAUDE_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: ai-portal-claude
                  key: CLAUDE_ACCOUNTS
            - name: CLAUDE_ACCOUNT
              value: wayside
            # 1Password service-account token — the secret broker. Two distinct paths need
            # it, and only the first works without any per-project setting: a project may
            # write `op://…` refs into its `mcpServers`/`env`, which the dispatcher resolves
            # HERE and hands the agent only the resolved values. The second is a project
            # with `opDirect: true`, which forwards this token itself into the agent's
            # environment so the baked `op` CLI works in Bash. Without this var the first
            # path silently resolves to an EMPTY STRING (the dispatcher logs it; nothing
            # reaches the UI), which reads like a broken MCP server rather than a missing
            # credential — that is the failure this variable exists to prevent.
            #
            # Scope note: this is the fleet-wide service account, so it can read every vault
            # that account is granted, and `opDirect` hands that reach to the agent. It
            # matches what v1's hosts already do (dispatcher.env.j2), but a service account
            # scoped to just the vaults this cluster needs would be strictly better — swap
            # the value in the Secret, no manifest change.
            - name: OP_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-portal-op
                  key: OP_SERVICE_ACCOUNT_TOKEN
            # S3, the dispatcher's half. Two jobs: archive each finished session's redacted
            # transcript to `<bucket>/<HOST_ID>/<project>/<session>.jsonl` (so history
            # outlives this pod's PVC — the portal's own copy is the only other one), and
            # `aws s3 cp` an uploaded file down into `<project>/.uploads/` after the portal
            # has put it there. All three variables must be present or the dispatcher's
            # s3Configured() is false and both features stay silently off.
            #
            # The archive half needs dispatcher **>= 2.1.2** here. Both the archive call and
            # the transcript it archives used to live in the container agent path only, so
            # AGENT_MODE=inprocess — the only mode this cluster can run, having no docker
            # socket — wrote nothing while every credential checked out. (2.1.1 added the
            # call and still wrote nothing, because the transcript was empty; hence 2.1.2.)
            # If transcripts stop appearing under `<bucket>/k3s/`, check this image tag in
            # kustomization.yaml before suspecting the IAM keys.
            #
            # Note `opDirect: true` projects get these forwarded into the agent's own env
            # alongside the 1Password token, which is what lets an agent run `aws s3` itself.
            - name: HISTORY_S3_BUCKET
              value: 292875404443-ai-portal-history
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ai-portal-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-portal-s3
                  key: AWS_SECRET_ACCESS_KEY
            # Concurrency cap. It no longer protects THIS process — agents are pods now — it
            # protects the NODE: two concurrent runs at the AGENT_JOB_MEMORY limit below is
            # 3Gi on a 7.9Gi box that already sits around 5Gi. Unlimited (the default) would
            # let one busy afternoon push the kubelet into eviction.
            - name: MAX_AGENTS
              value: "2"

            # ── job mode ──────────────────────────────────────────────────────────────
            # The runner ships in the dispatcher's own image and must be the SAME BUILD as the
            # dispatcher that spawned it, so this value is not maintained by hand: the
            # `replacements` block in kustomization.yaml copies the container image above into
            # it at render time. (The dispatcher would default to $IMAGE_DIGEST, which nothing
            # in the build sets — leaving it unset fails every run with "AGENT_JOB_IMAGE not
            # configured", so it is set here explicitly rather than left to a default.)
            - name: AGENT_JOB_IMAGE
              value: registry.kiitconsulting.com/ai-portal-dispatcher:latest
            # A private registry, and the Job's pod pulls the same image this one did.
            - name: AGENT_JOB_PULL_SECRET
              value: registry-pull
            # Where the runner dials back. A Job has no pipe to its parent, so it opens a
            # WebSocket carrying the same NDJSON frames the container path moves over stdout.
            # This MUST be the Service name below and never this pod's IP: a dispatcher restart
            # would otherwise strand every in-flight agent on a dead address.
            - name: AGENT_CHANNEL_HOST
              value: ai-portal-dispatcher.ai-portal.svc.cluster.local
            - name: AGENT_CHANNEL_PORT
              value: "8788"
            # The same two volumes this pod holds. local-path is RWO, which on a single-node
            # cluster still means "any pod on this node" — that is what lets an agent's pod see
            # the project tree the dispatcher cloned. State is mounted per project under a
            # subPath, so `resume` outlives the pod and two projects cannot corrupt each other's
            # session map. (fsGroup reaches the subPath directory, verified on this cluster —
            # without that the agent would land on a root-owned dir and fail to write $HOME.)
            - name: AGENT_JOB_WORKSPACE_CLAIM
              value: ai-portal-workspace
            - name: AGENT_JOB_STATE_CLAIM
              value: ai-portal-dispatcher-state
            # The agent's own ceiling, which used to be this pod's. Deliberately below the 2Gi
            # of `inprocess`: two of these plus the dispatcher must fit a node whose limits are
            # already 84% committed, and an agent that hits the cap now dies alone.
            - name: AGENT_JOB_CPU
              value: "1500m"
            - name: AGENT_JOB_MEMORY
              value: 1536Mi

            # ── tsnets (per-project tailnets), which job mode is the prerequisite for ──
            # Managed from the portal's Hosts tab; each one becomes a tailscaled Deployment +
            # Service + PVC + two NetworkPolicies in this namespace, created by the dispatcher
            # rather than by Argo CD (they are user state, not GitOps state — and they carry no
            # Argo tracking label, so `prune: true` leaves them alone).
            #
            # The file listing them has to live on the volume: the default sits beside
            # PROJECTS_FILE, which is already /state, but stating it means a later move of
            # PROJECTS_FILE cannot silently orphan every running tailnet.
            - name: TSNETS_FILE
              value: /state/tsnets.json
            # What an agent pinned to a tsnet may NOT dial — this is the isolation, so it is
            # spelled out rather than left to a default that happens to match: k3s pod network,
            # service network, and the node metadata endpoint. Everything else on the Internet
            # stays reachable, because the Anthropic API is not on anyone's tailnet. Verified
            # against this cluster (podCIDR 10.42.0.0/24 of 10.42.0.0/16, kubernetes svc
            # 10.43.0.1); change these if k3s is ever reinstalled with other ranges.
            - name: CLUSTER_CIDRS
              value: 10.42.0.0/16,10.43.0.0/16,169.254.169.254/32
          ports:
            # Named so the Service below can target the name rather than repeat the number.
            - name: channel
              containerPort: 8788
          volumeMounts:
            - name: state
              mountPath: /state
            - name: workspace
              mountPath: /workspace
          # No probes: the dispatcher serves no HTTP and its liveness question — "is the
          # portal socket up?" — is not observable from inside. A tcpSocket/exec probe here
          # would only re-assert that node is running, which the kubelet already knows, and
          # a false negative would kill live agent runs. The portal's Hosts page is the real
          # health signal, and the dispatcher reconnects on its own.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              # No longer the agent's ceiling — that moved to AGENT_JOB_MEMORY above. What is
              # left here is the funnel itself: sockets, the session map, and the transcript it
              # buffers per run before archiving it to S3. Kept at 2Gi through the cutover
              # rather than trimmed on a guess; in-process runs had it at ~1.4Gi resident, so
              # the real figure is worth re-measuring once job mode has run a few days.
              cpu: "1500m"
              memory: 2Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: ai-portal-dispatcher-state
        - name: workspace
          persistentVolumeClaim:
            claimName: ai-portal-workspace
---
# The agent channel — the one thing job mode publishes, and only inside the cluster.
#
# Direction is worth being precise about, because it is the opposite of the portal link at the
# top of this file: the dispatcher DIALS the portal, and an agent Job DIALS the dispatcher.
# Nothing here is reachable from outside the cluster, no Ingress fronts it, and the Cloudflare
# Access gate is not in the path.
#
# It has to be a Service and not a pod IP for the reason RollingUpdate is banned above: the pod
# is cattle, and an agent that outlives a dispatcher restart would otherwise be holding a socket
# to an address that no longer exists. Auth on the channel is a per-run bearer token, minted
# with the Job and consumed by the first socket that presents it, so being resolvable
# namespace-wide is not itself an opening — and a pinned agent's NetworkPolicy allows exactly
# this port on exactly this pod, which is why the dispatcher's `app` label is load-bearing.
apiVersion: v1
kind: Service
metadata:
  name: ai-portal-dispatcher
  labels:
    app: ai-portal-dispatcher
spec:
  type: ClusterIP
  selector:
    app: ai-portal-dispatcher
  ports:
    - name: channel
      port: 8788
      targetPort: channel

# ai-portal v2 — the control plane / UI of the Claude Code portal. Source lives in
# ikscream/ai-portal-v2; CI there builds the image and pushes it to the in-cluster
# registry, and the tag in kustomization.yaml is what deploys it.
#
# **One pod, and the old one must be gone before the new one starts.** The portal's
# host registry and its live agent sessions are in-memory Maps (`dispatchers`,
# `agents` in src/server.ts) — a second replica does not share them, so browsers
# would land on one pod while a dispatcher's WebSocket is held by the other, and
# the Console would show a host as offline while it is streaming events next door.
# Hence `replicas: 1` and `strategy: Recreate`: the default RollingUpdate overlaps
# the two pods for a few seconds, which is exactly the split-brain window, and the
# RWO volume below could not be mounted by both anyway.
#
# **The engine does not run here.** The portal holds auth, the host registry, the history
# and the routing; a **dispatcher** (dispatcher.yaml) runs the agents and dials in over
# `/dispatch` with the Bearer DISPATCH_TOKEN below. Both halves read it from the same
# Secret, and `bearerOk()` in src/server.ts fails closed when it is unset — which is what
# kept the endpoint refusing every connection while no dispatcher existed.
#
# **Auth is Cloudflare Access, verified here at the origin** (docs/cloudflare-access-sso.md).
# The edge gate alone would not be enough: grey and orange hosts share this node's IP, so
# anyone sending the right `Host:` header straight to 178.104.210.183 walks past Access —
# and with no PORTAL_BASIC_AUTH the portal's own `NO_AUTH_CONFIGURED` branch would then let
# them all the way in. Arming PORTAL_ACCESS_* makes the pod itself check the signed
# assertion, so the origin is closed whether or not the request came through Cloudflare.
# Deliberately NOT paired with PORTAL_IP_ALLOWLIST: that gate reads the client address from
# the `CF-Connecting-IP` header, which only Cloudflare can be trusted to set — and this
# origin is directly reachable, so a caller could simply set it themselves.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-portal-state
  labels:
    app: ai-portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-portal
  labels:
    app: ai-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-portal
  template:
    metadata:
      labels:
        app: ai-portal
    spec:
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        # The image runs as `node` (uid 1000). local-path hands over a fresh
        # directory owned by root, so without fsGroup the portal cannot write a
        # single one of the state files below and crash-loops on first append.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: portal
          image: registry.kiitconsulting.com/ai-portal:latest
          ports:
            - name: http
              containerPort: 8787
          env:
            # Bind on all interfaces. The default is 127.0.0.1 (v1 sits behind a
            # Cloudflare Tunnel on the host); keep that default here and the
            # kubelet's probes and Traefik both get connection-refused.
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8787"
            # Every state path defaults to the CWD (/app), which is the container's
            # ephemeral layer — history and audit rows would be lost on each
            # rollout. Point all of them at the mounted volume explicitly.
            - name: HISTORY_FILE
              value: /state/history.jsonl
            - name: FINALIZE_DIR
              value: /state/finalized
            - name: SESSIONS_LOG
              value: /state/portal-sessions.json
            - name: SESSION_TX_DIR
              value: /state/session-transcripts
            # The request queue (2.3.0). Its default already derives from SESSIONS_LOG above, so
            # this is belt to those braces — and it keeps the rule that every state path this pod
            # writes is named here, so moving one cannot silently orphan another.
            - name: QUEUE_FILE
              value: /state/portal-queue.json
            - name: STATS_LOG
              value: /state/portal-stats.jsonl
            - name: AUDIT_LOG
              value: /state/portal-audit.jsonl
            - name: ACCOUNTS_FILE
              value: /state/portal-accounts.json
            - name: KNOWN_HOSTS_FILE
              value: /state/portal-hosts.json
            # Cloudflare Access, checked at the origin. Both are required to arm the gate —
            # src/server.ts leaves it OFF if either is missing, so a half-configured Access
            # cannot read as a working one. The AUD is the "ai-portal v2 (console)" app's;
            # it is not a secret (it is the `kid=` in the public Access login redirect), but
            # it IS load-bearing: the team JWKS signs tokens for every app in the Zero Trust
            # account, so without it a token minted for Argo CD or Grafana would open this.
            - name: PORTAL_ACCESS_TEAM_DOMAIN
              value: silent-grass-7cb0.cloudflareaccess.com
            - name: PORTAL_ACCESS_AUD
              value: 742ff00b2a78cf3f46e0df94105d09c87d6f6338830dffd33bc5e461a346d2fe
            # /ws is an Access-BYPASS app (a login redirect on the WebSocket handshake breaks
            # it), so the browser's WS carries no assertion header. It falls back to the
            # CF_Authorization cookie — which iOS WebKit does not send on a wss:// upgrade at
            # all. This secret keys the portal's own `ap_ws` cookie and the `?t=` URL token,
            # and query params always ride the handshake, so it is the mobile-safe path. It
            # would otherwise derive from PORTAL_BASIC_AUTH/DISPATCH_TOKEN, both unset here,
            # leaving iOS with no way to authenticate its socket.
            - name: WS_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-portal-auth
                  key: WS_COOKIE_SECRET
            # Arms /dispatch. Same Secret key the dispatcher mounts, so the two cannot
            # drift; note the WS cookie key above derives from this when unset, which is
            # why WS_COOKIE_SECRET is set explicitly rather than left to follow it.
            - name: DISPATCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-portal-auth
                  key: DISPATCH_TOKEN
            # S3. The portal writes three things there: the usage-stats and audit rings
            # (mirrored on a dirty-flag timer, restored on boot when the local file is
            # empty — which is what survives a lost PVC), the WS handshake diagnostics,
            # and the PUT half of file upload. That last one is why BOTH halves of the app
            # need these credentials: the browser uploads to the portal, the portal puts
            # the object, and only then does the dispatcher pull it down — wire just the
            # dispatcher and upload still fails, one step later. The portal ships no `aws`
            # CLI and signs SigV4 itself, reading the bucket and region from here.
            #
            # Neither the bucket nor the region is a credential, so they stay literals
            # where they are greppable; only the two keys come from the Secret.
            - name: HISTORY_S3_BUCKET
              value: 292875404443-ai-portal-history
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            # Names the S3 prefix those mirrors write to (`portal-stats/<id>/`,
            # `portal-logs/<id>/`) and nothing else on the portal side. It MUST be set:
            # src/server.ts falls back to os.hostname(), which in a Deployment is the pod
            # name, so every rollout starts a fresh prefix and abandons the previous one.
            # The restore-on-boot path then reads a prefix that is empty by construction,
            # which quietly turns the durable mirror into write-only garbage — precisely
            # the failure it exists to prevent, on a cluster whose local-path PVC is the
            # node filesystem. Not the dispatcher's host id, though sharing the name is
            # fine: these prefixes never collide with `<bucket>/<host>/<project>/`.
            - name: HOST_ID
              value: k3s
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ai-portal-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-portal-s3
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: state
              mountPath: /state
          # /api/version is the portal's own health endpoint (it is what v1's ansible deploy
          # gates its cutover on). Cheap, no disk touch — but it is NOT unauthenticated: the
          # whole HTTP handler sits behind the auth gate. With PORTAL_ACCESS_* armed above, a
          # kubelet `httpGet` probe reaches the pod IP from the node carrying no Access
          # assertion and no CF-Connecting-IP, which the portal fails closed on — measured:
          # 403, i.e. a liveness failure every 20s and a CrashLoop on a perfectly healthy pod.
          # src/server.ts already exempts one caller for exactly this reason — a *loopback*
          # call, which cannot come from off the box — so the probe runs inside the container
          # and dials 127.0.0.1. That keeps a real HTTP health check (a tcpSocket probe would
          # pass on a wedged server that still accepts connections) at ~45ms per run.
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - require('http').get('http://127.0.0.1:8787/api/version',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - require('http').get('http://127.0.0.1:8787/api/version',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              # CPU is deliberately generous against a 15m average, because the average is
              # the wrong statistic for this pod. Node work arrives in bursts — GC, the libuv
              # pool, a WebSocket fan-out — and a 500m quota is 50ms of CPU per 100ms period,
              # which a burst drains in one go. Measured at 500m: throttled 15% of periods
              # over an hour, 27% at peak over a day, while using 15Mi of CPU-seconds' worth
              # of a single core. That throttle lands on the /ws stream and the UI, which is
              # everything this pod does. Node CPU peaks at 42%, so the headroom is free.
              cpu: "1500m"
              # Memory stays at 512Mi: this half holds no engine, and peaks at 46Mi.
              memory: 512Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: ai-portal-state

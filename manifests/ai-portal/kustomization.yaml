  # agent run is interrupted.
  #
  # 2.8.3 (ai-portal-v2 #26) — ctx% was measured against the wrong context window. The SDK
  # reports contextWindow=200000 for claude-opus-5, whose real max_input_tokens is 1,000,000,
  # so every figure was 5x high (sessions file read 227%; max across 229 runs was 468%) and
  # getContextUsage() inherited the same error. The window now comes from the Models API,
  # cached per process. Matters beyond cosmetics: this value feeds SESSION_MAX_CONTEXT_PCT=80.
  #
  # 2.8.4 (ai-portal-v2 #27) — carried only for the version badge; the fix in that release is
  # entirely dispatcher-side (see the pin below).
  #
  # 2.8.6 (ai-portal-v2 #29) — the portal half of agent adoption, and it is NOT optional: the
  # dispatcher now keeps the runs that outlive it and lists them in `register` as
  # `runningAgents`, but a portal that does not read that field declares them dead anyway and
  # requeues their queue tasks. Measured with the dispatcher already on 2.8.6 and the portal
  # still on 2.8.5: the agent was adopted and its runner reconnected, and the portal reclaimed
  # its task regardless and re-dispatched it twice (both refused by the dispatcher's concurrency
  # guard, which is the only reason the live run survived). Bump the two together.
  #
  # 2.8.5 (ai-portal-v2 #28) — a project save told every chat the host had restarted. The
  # dispatcher re-sends `register` to re-advertise after `projects_upsert` (every project edit,
  # including the Console's inline Account picker) and after a tsnet change; the portal treated
  # ANY register as a process restart and cleared every running agent for that host — a red
  # "the host restarted" per agent, threads flipped to idle, and their queue tasks requeued and
  # re-dispatched, all against runs that were still going. The error also carried no `agentId`,
  # and the client attributes an agentId-less event to whichever thread is open, so one host
  # event landed as N errors in whatever chat the reader was looking at. `startedAt` (already on
  # the wire, stable across re-advertisements) now decides; a dispatcher too old to send it keeps
  # the old behaviour. Portal-only — the dispatcher pin below does not move, so nothing in
  # flight is interrupted by this deploy.
  #
  # 2.9.0 (ai-portal-v2 #30) — Sign in with Apple, so the planned iOS app can authenticate at
  # all. The app is a WKWebView over this origin and Google refuses OAuth inside an embedded
  # WebView, so it can never complete the Access → Google SSO login the desktop browser uses.
  # It signs in natively instead: POST /api/apple/session takes the Apple identityToken, the
  # portal verifies it against Apple's JWKS and returns a session carried as `X-AP-Session`
  # (or the ap_ios cookie). /ws needs no new path — the app fetches /api/ws-token like the
  # browser and connects with ?t=.
  #
  # SHIPS DORMANT. The gate needs PORTAL_APPLE_AUD *and* PORTAL_APPLE_SUB (the allowlist of
  # Apple user ids) to arm; neither is set in deployment.yaml, so this deploy changes nothing
  # for the browser. Arming it also needs an Access BYPASS for /api/apple/session, or the edge
  # challenges the app before the portal ever sees the token. The sub allowlist — not the
  # signature — is the gate: an Apple signature only proves "some Apple ID", so aud alone
  # would admit anyone with an iPhone. Bootstrap the sub by signing in once with it unset and
  # reading the value off the refused row in the Log tab.
  #
  # Portal-only — the dispatcher pin below stays on f607de1, so nothing in flight is
  # interrupted and the 2.8.6 adoption pairing above is preserved.
  #
  # 2.9.1 (ai-portal-v2 #31) — the bootstrap procedure 2.9.0 documented always 404'd. Finding
  # your Apple `sub` means signing in once and reading the value off the refusal, because Apple
  # publishes it in no console; but the login route returned 404 before verifying anything
  # whenever the gate was off, and the gate is off until the allowlist is set. So step one of
  # arming this was a dead end. The route now runs on audience + secret alone (BOOTSTRAP MODE,
  # visible in the boot log and as `apple(bootstrap)` in the auth summary), while everything
  # that grants access still requires the allowlist — an empty allowlist refuses every subject,
  # so the route can only emit a rejection and never mints a session.
  #
  # This deploy also sets PORTAL_APPLE_AUD in deployment.yaml, which puts the portal INTO that
  # bootstrap mode: still no way in, but a sign-in attempt now logs the sub to allowlist.
  #
  # Portal-only — the dispatcher pin below stays on f607de1, so nothing in flight is interrupted.
  #
  # 2.10.0 (ai-portal-v2 #32) — threads in the Console rail can be renamed: ✎ on every row,
  # POST /api/queue/:id/rename. A thread has always been named after the first line of the
  # prompt that started it, which is a fair guess for one request and wrong for a conversation
  # that moved on. The rename touches the title only — session id, transcript and prompts are
  # untouched — and both directions are audited, so the Log still says what a row used to be
  # called.
  #
  # Same deploy fixes the rail's ✕ "Remove this thread", which had never worked: the client has
  # posted /api/queue/:id/delete since threads shipped and the server had no handler for it, so
  # the confirm dialog was followed by an "unknown action" error and the thread stayed.
  #
  # Portal-only — the dispatcher pin below stays on f607de1. The 3970a83 build produced a
  # dispatcher image too (dispatcher.yml also watches src/**); it is deliberately NOT pinned
  # here, because rolling the dispatcher is its own deploy and there were live agents.
  #
  # 2.11.0 (ai-portal-v2 #33) — a Templates tab. The composer's 📋 menu was a const in
  # index.html, so adding a prompt meant an image build and a pin bump like this one, for a
  # piece of text. The nine built-ins now SEED /state/portal-templates.json the first time a
  # portal boots without it (TEMPLATES_FILE, added to deployment.yaml with this deploy), and
  # the copy on the volume is authoritative afterwards — a later image never overwrites an
  # edit, and deleting the last template sticks rather than reappearing on the next restart.
  #
  # Portal-only again: the dispatcher pin below stays on f607de1.
  #
  # 2.12.0 (ai-portal-v2 #34) — 1Password access stops being one boolean. `opDirect` handed an
  # agent the whole service account the dispatcher runs as; narrowing it meant editing the
  # dispatcher env and redeploying, so nobody narrowed it. A host now holds a NAMED pool
  # (Hosts -> Manage 1Password: a reference the broker resolves at run time, or a pasted token
  # kept 0600 on the dispatcher's state volume and never readable back), and each project
  # multi-selects from it. The first selection becomes OP_SERVICE_ACCOUNT_TOKEN, every one also
  # arrives as OP_TOKEN_<NAME>, and the runner tells the agent how to switch between them.
  #
  # BOTH PINS MOVE TOGETHER, and that is not optional here: the pool lives on the dispatcher
  # (opaccounts.json next to projects.json, advertised in `register`), so a portal on 2.12.0
  # against an f607de1 dispatcher shows an empty pool and a "Manage 1Password" button whose
  # every call times out. The dispatcher roll is also the first one taken with adoption already
  # deployed (2.8.6, #29): the Jobs in flight now DO carry the annotations, so they should be
  # adopted rather than reaped — which is exactly what that release was for.
  #
  # 2.13.0 (ai-portal-v2 #35) — durability, and nothing user-visible. Four things the /state
  # volume was quietly getting wrong: state files written non-atomically (a torn write read
  # back as a fresh install and the next save overwrote it — portal-accounts.json, the pool
  # 2.12.0 just added, is one of the five); session transcripts that nothing ever deleted and
  # that were read synchronously, 57ms of blocked event loop on the largest live one; S3
  # snapshots re-uploading a 1.33 MB ring whole every dirty minute onto a versioned bucket
  # with no DeleteObject (now gzipped, 31x measured, skipped when unchanged, 5-minute tick);
  # and a MAX_AGENTS refusal leaving a phantom user turn in the session transcript.
  #
  # BOTH PINS MOVE TOGETHER again, though this time only the last item is the dispatcher's —
  # the two are versioned in lockstep and there is no reason to split them. Retention was
  # checked against this cluster before merging (58 records, 58 transcripts, no orphans, all
  # inside the window), so the first prune here deletes nothing; expect a "pruned sessions"
  # line only once something ages past SESSION_KEEP_MS (60d).
  #
  # 2.13.1 (ai-portal-v2 #36) — a message sent from a phone could vanish instead of being sent.
  # Reported from iPhone Chrome and reproduced in a 390x844 viewport: `send()` empties the
  # composer BEFORE the request (deliberately — on a free project the server dispatches inside
  # the POST and echoes the prompt back, so a later clear would wipe it), but no failure path
  # put the text back and there was no error handling at all. Two ordinary mobile events ate the
  # message: a Wi-Fi/cellular handoff makes fetch REJECT (composer emptied, one unhandled
  # rejection, nothing shown), and an Access session that expired while the tab slept answers the
  # POST with the SSO login page — HTTP 200 + HTML, which passed the r.ok check and was treated
  # as a sent message with NO console error at all. A desktop on stable Wi-Fi with a fresh cookie
  # sees neither, which is why it only ever showed up on the phone.
  #
  # Every failure now hands the text back and says why; a draft typed in the meantime is not
  # clobbered (the failed message goes into the error line instead); uploads and pendingResume
  # are restored. thAct() had the same two flaws and backs cancel/close/rename/delete, so those
  # could fail as silently — fixed there too.
  #
  # public/index.html only — the dispatcher pin below does not move, so nothing in flight is
  # interrupted by this deploy.
  #
  - name: registry.kiitconsulting.com/ai-portal
    newTag: "0407a23"
  # 2.3.0 too, and NOT optional for the queue: the portal now sends `newSession` on a run frame
  # to say "this task is its own conversation". An older dispatcher ignores it and resumes
  # whatever that agent last talked about, so every queued task after the first would silently
  # continue the previous one's session — same context, same bill, one thread instead of several.
  #
  # 2.2.1 (#8) was the previous pin: 2.2.0 was the cutover to AGENT_MODE=job and it took every
  # project down (agent HOME moved under a per-project subPath, so session ids pointed at
  # transcripts the new pods could not see, and an unresumable id was retried forever rather than
  # dropped). Rolling the cutover back means putting this to 6c9c14b, not reverting the manifests.
  - name: registry.kiitconsulting.com/ai-portal-dispatcher
  # 2.6.1 (ai-portal-v2 #20) — agent pod REQUESTS became tunable and are now set from measured
  # peaks (AGENT_JOB_*_REQUEST in dispatcher.yaml). Bumped together with MAX_AGENTS 3 -> 4:
  # the requests are what make 4 safe, because the scheduler can now refuse a 4th agent that
  # does not fit instead of the kubelet OOM-killing something at random. This pin also carries
  # 2.4.2's `maxAgents` advertisement, so the portal's agents:N/M finally shows a denominator
  # up front rather than learning it from a refusal.
  #
  # NOTE the agent image follows this pin automatically — the `replacements` block below copies
  # it into AGENT_JOB_IMAGE, because the runner must be the same build as its dispatcher.
  # 2.6.2 (ai-portal-v2 #21) — Stop killed the agent but never said so. It deleted the Job and
  # the pod really died, but the Job watch only reacted to succeeded/failed, and a DELETED Job
  # is neither — so run_done was never emitted and the portal kept the agent `running`: Console
  # stuck on "thinking...", thread stuck until the 15-minute sweep, and its agent SLOT spent the
  # whole time. Measured in prod: 3/4 slots reported with two agents actually running. That last
  # part is why this is urgent now rather than cosmetic — every ghost permanently costs one of
  # the four. The watch handles DELETED, a stopped run reports an `outcome` (not an `error`, or
  # the thread would read as failed), and the stop path finally logs which arm it took.
  #
  # 2.8.0 (ai-portal-v2 #23) — Job agents get their SKILLS. They have had none since the job-mode
  # cutover: the runner already looks in $CLAUDE_CONFIG_DIR/skills and puts each skill's CLI on
  # PATH, but the Job spec mounted nothing there, so every agent on this cluster re-derived by
  # hand what exists as a tested CLI (in-process and container agents never saw it — they inherit
  # the dispatcher's HOME, which is where they live). AGENT_JOB_SHARED_SUBPATHS now mounts
  # read-only slices of the dispatcher's state claim into every agent Job, defaulting to the pair
  # that wires skills: `.claude/skills` AND `ai/github.com/ikscream`. Both are needed — the farm
  # is symlinks to ABSOLUTE paths in the repo tree, so the farm alone is 16 dangling links. No
  # manifest change is required to turn it on, only this pin.
  #
  # 2.8.2 (ai-portal-v2 #25) — THE REASON TO ROLL THE DISPATCHER. Every run for a project
  # produced the same Job name (jobNameFor hashed the agentId, which is <host>::<project>), and
  # runAgentJob deletes a leftover Job of that name before creating one — so a second prompt
  # deleted the Job of the run still in flight. Measured on claude-waysidepublishing: a Bash
  # tool_use with no tool_result, two runs 92s apart sharing one Job name, the first reporting
  # done 30 minutes later against a pod deleted under it, and five stop{route:"none"} entries
  # because the corpse had nulled the live run's routing on its way out. Names now carry a
  # per-run nonce, a project runs one at a time (checked against the Job, so a stale record
  # cannot wedge it), and finish() only clears state it still owns.
  #
  # 2.8.4 (ai-portal-v2 #27) — THE REASON TO ROLL THE DISPATCHER, and it outranks anything
  # above it: no agent could work for longer than half an hour. A Kubernetes watch is expired
  # by the API server at --min-request-timeout (1800s) plus jitter and delivered as a clean
  # EOF; the Job watch read that as "the Job is gone", ended the run, and — via finish() —
  # DELETED the Job, SIGKILLing a healthy agent somewhere between 30 and 60 minutes in.
  # Measured over 60 job runs on this cluster: every run under 30 minutes finished cleanly
  # (longest 29.7), and both runs past it died as "lost track of the agent Job" — one of them
  # part-way through a `terraform apply` against production AWS, which left a stale state lock
  # for the next agent to force-unlock. An ended watch now only means "ask again": re-arm,
  # poll, and let the Job itself end the run. Verified against a stub API server that expires
  # the watch on the same shape (before: DELETE 4s in, after: two re-arms then a clean finish).
  #
  # ROLLING THIS USED TO KILL EVERY RUN IN FLIGHT — see 2.8.6 below, which is the fix. The rule
  # it replaces, kept because it still describes every dispatcher up to and including 2.8.5: the
  # runner rides out a socket blip but not a new process, because channelTokens lived only in
  # dispatcher memory, so a reconnect after a restart was 401ed and the runner aborted ~40s later.
  #
  # 2.8.6 (ai-portal-v2 #29) — the dispatcher adopts the agent Jobs that outlive it. A Job keeps
  # running when the pod that made it dies; what died with the process was everything needed to
  # TALK to it (the channel token, the agent record, the watch), and boot then deleted the Jobs
  # outright. The Job now carries `ai-portal.agent-id` / `ai-portal.project` / `ai-portal.started-at`
  # as annotations and its channel token was always in the pod spec, so on boot the dispatcher
  # rebuilds the record, reattaches the watch, honours the token, and reaps only what it cannot
  # talk to. `register` advertises those agents so the portal stops declaring them dead and
  # requeueing their tasks, and the runner's riding-out budget goes ~40s -> ~2min. Verified by
  # kill -9ing a dispatcher mid-run against a stub API server: before, the Job was deleted at
  # boot; after, it is adopted and the runner's reconnect with that Job's own token is accepted.
  #
  # THIS PARTICULAR ROLL STILL KILLS WHAT IS RUNNING. The Jobs in flight right now were created
  # by 2.8.5 and carry no annotations, so the new dispatcher cannot adopt them and reaps them
  # exactly as before. The benefit starts from the NEXT roll.
  #
  # 2.12.0 (ai-portal-v2 #34) — THE REASON TO ROLL THE DISPATCHER: it owns the named 1Password
  # pool the portal above only displays. It also injects the selected tokens on all three agent
  # paths (job, container, in-process), so a project's choice means the same thing whichever
  # mode the host runs.
  #

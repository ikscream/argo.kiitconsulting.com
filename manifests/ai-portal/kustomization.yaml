  # moment. Until then the portal takes the fallback path, which is 1 refusal instead of 900.
  #
  # 2.4.0 (#15) was the previous pin: threads in the Console — the rail beside the conversation
  # that holds waiting requests, and the Send button that asks where the message goes.
  # 2.7.0 (ai-portal-v2 #22) — the tab icon is legible and now carries the run state. The old
  # favicon was hairline strokes on a near-white tile: at 16px on a light tab strip it was gone.
  # New mark is full-bleed on the app's own #0E1116 in its own cyan, rendered from vector so it
  # is crisp at 16px (the gpt-image-1 raster it was designed from is not — it turns to mush).
  # The cursor bar carries state: cyan idle, amber busy, red wants-you, green done — for the
  # project IN VIEW, so a tab showing A does not go green because B finished.
  #
  # 2.8.0 (ai-portal-v2 #23) — a Templates entry that makes an agent look at its skills: discover
  # them (the catalog skill, the skills dir's frontmatter, PATH), report one table of
  # when-to-use/how-to-invoke, then prefer a skill over hand-rolling for the rest of the session.
  # The other half of that release is dispatcher-side and is what gives a Job agent any skills to
  # find at all — bump both, or this button reports an empty list.
  #
  # 2.8.1 (ai-portal-v2 #24) — the skills template now leads with `ai-skill list`,
  # which prints the whole catalog in one shell call instead of spending a
  # Skill-tool approval on strictly less information, and tells the reader to
  # honour a description that says the skill cannot run on this host (ai-latex
  # needs a docker daemon, ai-drawio's export a desktop binary; neither exists

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - dispatcher.yaml
  - rbac.yaml
  - service.yaml
  - ingress.yaml

# Keep the agent runner on the exact image of the dispatcher that spawned it. The runner is a
# second entrypoint in the dispatcher's own image, so a Job started by build A but running
# build B is a whole class of bug — and it is precisely what a hand-maintained AGENT_JOB_IMAGE
# would produce the first time someone bumped the tag below and not the env var. This copies
# one into the other at render time, after `images:` has rewritten it, leaving one tag to bump.
replacements:
  - source:
      kind: Deployment
      name: ai-portal-dispatcher
      fieldPath: spec.template.spec.containers.[name=dispatcher].image
    targets:
      - select:
          kind: Deployment
          name: ai-portal-dispatcher
        fieldPaths:
          - spec.template.spec.containers.[name=dispatcher].env.[name=AGENT_JOB_IMAGE].value
# Both images are built by ikscream/ai-portal-v2 (.forgejo/workflows/{portal,dispatcher}.yml —
# moved off .github by #13, so only one forge builds them)
# and pushed to the S3-backed registry; these tags are the GitOps deploy trigger. That repo
# does not yet write them back here (it is a separate repo, so the write-back needs a
# cross-repo token) — until it does, bump them by hand to the short SHA the build summary
# prints. They are versioned independently: a portal change does not restart the dispatcher,
# which is what you want, because restarting it interrupts live agent runs.
images:
  # 2.6.0 (ai-portal-v2 #19) — the host's agent cap is finally visible. `agents:N/M` in the
  # Console statusline (ramping amber/red as it fills) and an Agents row on the Hosts card,
  # pushed live on every run start/finish. This is the number that decides whether a request
  # runs now or parks at "queued", and until now nothing showed it.
  #
  # NOTE the dispatcher pin below still does not move. 2.4.2 taught the dispatcher to advertise
  # maxAgents, but bumping it restarts it and interrupts every live agent run, so instead the
  # portal LEARNS the cap from the refusal text ("busy: 3 agents already running on this host")
  # and persists it. On this cluster that means the denominator appears the first time the host
  # fills up. Bump the dispatcher when the queue is idle to get it advertised up front.
  #
  # 2.5.1 (ai-portal-v2 #18) — "+ New thread" actually starts one. Pressing it, typing and
  # sending sent the message as a FOLLOW-UP on whatever was already running for that project:
  # no task created, nothing in the rail, and the text landed in an unrelated conversation.
  # "Nothing is selected" and "the human asked for a new thread" were the same value, so the
  # running-thread fallback in sendTarget() outranked an explicit request. Only reachable while
  # a run was in flight, which is how it survived #15. public/index.html only.
  #
  # 2.5.0 (ai-portal-v2 #17) — the Console reads quieter. Your own prompts stop being a
  # bordered blue bubble and become a band the width of the transcript, a couple of percent
  # off the page colour (1.08:1 light / 1.10:1 dark, measured); stream notes stop being pills
  # and become a label with a rule; the final-answer card loses its panel and keeps its accent
  # bar. What still needs an answer stays loud — permission prompts keep their border, errors
  # their red bar. Same release also adds ✕-to-delete on rail and History threads (real
  # deletion, not another way to file them) and makes the 1100px content cap step up on wide
  # monitors. public/index.html only — src/ is untouched, so the dispatcher pin below stays
  # put and no live agent run is interrupted.
  #
  # 2.4.2 (ai-portal-v2 #16) — stop dispatching into a full host. With MAX_AGENTS=3, asking a
  # fourth project for anything produced a tight dispatch loop rather than a queued request:
  # drain -> dispatcher refuses `busy:` -> requeue -> drain, with nothing in it that waits.
  # Measured on prj-konstantin-0 on 2026-08-25: 18,178 identical prompt events written to one
  # session transcript in 141 seconds, each also echoing the prompt to every open browser and
  # pushing a red "busy: 3 agents already running" error into the Console. drain() now checks
  # for a free slot before dispatching, a refusal no longer re-drains on the spot, and `busy:`
  # is no longer shown as an error.
  #
  # The dispatcher pin below is deliberately NOT bumped with this. 2.4.2 also teaches it to
  # advertise `maxAgents` so the portal can pre-check, but that only turns "one wasted dispatch
  # per blocked request" into none — the loop itself is portal-side and is fixed here. Bumping
  # the dispatcher restarts it, which interrupts live agent runs, so it can wait for a quiet
  # moment. Until then the portal takes the fallback path, which is 1 refusal instead of 900.
  #
  # 2.4.0 (#15) was the previous pin: threads in the Console — the rail beside the conversation
  # that holds waiting requests, and the Send button that asks where the message goes.
  # 2.7.0 (ai-portal-v2 #22) — the tab icon is legible and now carries the run state. The old
  # favicon was hairline strokes on a near-white tile: at 16px on a light tab strip it was gone.
  # New mark is full-bleed on the app's own #0E1116 in its own cyan, rendered from vector so it
  # is crisp at 16px (the gpt-image-1 raster it was designed from is not — it turns to mush).
  # The cursor bar carries state: cyan idle, amber busy, red wants-you, green done — for the
  # project IN VIEW, so a tab showing A does not go green because B finished.
  #
  # 2.8.0 (ai-portal-v2 #23) — a Templates entry that makes an agent look at its skills: discover
  # them (the catalog skill, the skills dir's frontmatter, PATH), report one table of
  # when-to-use/how-to-invoke, then prefer a skill over hand-rolling for the rest of the session.
  # The other half of that release is dispatcher-side and is what gives a Job agent any skills to
  # find at all — bump both, or this button reports an empty list.
  #
  # 2.8.1 (ai-portal-v2 #24) — the skills template now leads with `ai-skill list`,
  # which prints the whole catalog in one shell call instead of spending a
  # Skill-tool approval on strictly less information, and tells the reader to
  # honour a description that says the skill cannot run on this host (ai-latex
  # needs a docker daemon, ai-drawio's export a desktop binary; neither exists
  # here). Portal-only — the dispatcher pin below does not move, so no live
  # agent run is interrupted.
  #
  # 2.8.3 (ai-portal-v2 #26) — ctx% was measured against the wrong context window. The SDK
  # reports contextWindow=200000 for claude-opus-5, whose real max_input_tokens is 1,000,000,
  # so every figure was 5x high (sessions file read 227%; max across 229 runs was 468%) and
  # getContextUsage() inherited the same error. The window now comes from the Models API,
  # cached per process. Matters beyond cosmetics: this value feeds SESSION_MAX_CONTEXT_PCT=80.
  #
  # 2.8.4 (ai-portal-v2 #27) — carried only for the version badge; the fix in that release is
  # entirely dispatcher-side (see the pin below).
  #
  - name: registry.kiitconsulting.com/ai-portal
    newTag: "52141eb"
  # 2.3.0 too, and NOT optional for the queue: the portal now sends `newSession` on a run frame
  # to say "this task is its own conversation". An older dispatcher ignores it and resumes
  # whatever that agent last talked about, so every queued task after the first would silently
  # continue the previous one's session — same context, same bill, one thread instead of several.
  #
  # 2.2.1 (#8) was the previous pin: 2.2.0 was the cutover to AGENT_MODE=job and it took every
  # project down (agent HOME moved under a per-project subPath, so session ids pointed at
  # transcripts the new pods could not see, and an unresumable id was retried forever rather than
  # dropped). Rolling the cutover back means putting this to 6c9c14b, not reverting the manifests.
  - name: registry.kiitconsulting.com/ai-portal-dispatcher
  # 2.6.1 (ai-portal-v2 #20) — agent pod REQUESTS became tunable and are now set from measured
  # peaks (AGENT_JOB_*_REQUEST in dispatcher.yaml). Bumped together with MAX_AGENTS 3 -> 4:
  # the requests are what make 4 safe, because the scheduler can now refuse a 4th agent that
  # does not fit instead of the kubelet OOM-killing something at random. This pin also carries
  # 2.4.2's `maxAgents` advertisement, so the portal's agents:N/M finally shows a denominator
  # up front rather than learning it from a refusal.
  #
  # NOTE the agent image follows this pin automatically — the `replacements` block below copies
  # it into AGENT_JOB_IMAGE, because the runner must be the same build as its dispatcher.
  # 2.6.2 (ai-portal-v2 #21) — Stop killed the agent but never said so. It deleted the Job and
  # the pod really died, but the Job watch only reacted to succeeded/failed, and a DELETED Job
  # is neither — so run_done was never emitted and the portal kept the agent `running`: Console
  # stuck on "thinking...", thread stuck until the 15-minute sweep, and its agent SLOT spent the
  # whole time. Measured in prod: 3/4 slots reported with two agents actually running. That last
  # part is why this is urgent now rather than cosmetic — every ghost permanently costs one of
  # the four. The watch handles DELETED, a stopped run reports an `outcome` (not an `error`, or
  # the thread would read as failed), and the stop path finally logs which arm it took.
  #
  # 2.8.0 (ai-portal-v2 #23) — Job agents get their SKILLS. They have had none since the job-mode
  # cutover: the runner already looks in $CLAUDE_CONFIG_DIR/skills and puts each skill's CLI on
  # PATH, but the Job spec mounted nothing there, so every agent on this cluster re-derived by
  # hand what exists as a tested CLI (in-process and container agents never saw it — they inherit
  # the dispatcher's HOME, which is where they live). AGENT_JOB_SHARED_SUBPATHS now mounts
  # read-only slices of the dispatcher's state claim into every agent Job, defaulting to the pair
  # that wires skills: `.claude/skills` AND `ai/github.com/ikscream`. Both are needed — the farm
  # is symlinks to ABSOLUTE paths in the repo tree, so the farm alone is 16 dangling links. No
  # manifest change is required to turn it on, only this pin.
  #
  # 2.8.2 (ai-portal-v2 #25) — THE REASON TO ROLL THE DISPATCHER. Every run for a project
  # produced the same Job name (jobNameFor hashed the agentId, which is <host>::<project>), and
  # runAgentJob deletes a leftover Job of that name before creating one — so a second prompt
  # deleted the Job of the run still in flight. Measured on claude-waysidepublishing: a Bash
  # tool_use with no tool_result, two runs 92s apart sharing one Job name, the first reporting
  # done 30 minutes later against a pod deleted under it, and five stop{route:"none"} entries
  # because the corpse had nulled the live run's routing on its way out. Names now carry a
  # per-run nonce, a project runs one at a time (checked against the Job, so a stale record
  # cannot wedge it), and finish() only clears state it still owns.
  #
  # 2.8.4 (ai-portal-v2 #27) — THE REASON TO ROLL THE DISPATCHER, and it outranks anything
  # above it: no agent could work for longer than half an hour. A Kubernetes watch is expired
  # by the API server at --min-request-timeout (1800s) plus jitter and delivered as a clean
  # EOF; the Job watch read that as "the Job is gone", ended the run, and — via finish() —
  # DELETED the Job, SIGKILLing a healthy agent somewhere between 30 and 60 minutes in.
  # Measured over 60 job runs on this cluster: every run under 30 minutes finished cleanly
  # (longest 29.7), and both runs past it died as "lost track of the agent Job" — one of them
  # part-way through a `terraform apply` against production AWS, which left a stale state lock
  # for the next agent to force-unlock. An ended watch now only means "ask again": re-arm,
  # poll, and let the Job itself end the run. Verified against a stub API server that expires
  # the watch on the same shape (before: DELETE 4s in, after: two re-arms then a clean finish).
  #
  # ROLLING THIS KILLS EVERY RUN IN FLIGHT. The runner rides out a socket blip but not a new
  # process: channelTokens lives in dispatcher memory, so a reconnect after a restart is 401ed
  # and the runner aborts ~40s later. Check `kubectl -n ai-portal get jobs` is empty first.
  #
    newTag: "52141eb"

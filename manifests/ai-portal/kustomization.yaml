  # NOTE the dispatcher pin below still does not move. 2.4.2 taught the dispatcher to advertise
  # maxAgents, but bumping it restarts it and interrupts every live agent run, so instead the
  # portal LEARNS the cap from the refusal text ("busy: 3 agents already running on this host")

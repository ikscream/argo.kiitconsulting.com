# Prometheus Operator + Grafana via the kube-prometheus-stack Helm chart.
# Everything is IaC here: Grafana's Prometheus datasource is auto-provisioned by
# the chart, Kubernetes dashboards are imported from grafana.com by gnetId and
# organized into folders, and Grafana-managed alerting (contact point, policy,
# rules) is provisioned too. Grafana is published at
# https://grafana-k8s.kiitconsulting.com; Prometheus and Alertmanager stay
# cluster-internal.
#
# Sized for the single cx33 (4 vCPU / 8 GB) node: Alertmanager off, short
# Prometheus retention, trimmed resources, and the k3s-unscrapeable control-plane
# monitors disabled. Out-of-band Secrets (ns monitoring): grafana-admin
# (op://ai-skills/grafana-kiit) and grafana-telegram (Telegram bot token from
# op://ai-skills/wq2n2roohzy3aqod22tecundri).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.3
    helm:
      releaseName: kps
      valuesObject:
        crds:
          enabled: true

        # k3s runs these inside the server process — no separate scrape targets.
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
        kubeEtcd: { enabled: false }

        # Save memory on the small node.
        alertmanager: { enabled: false }

        prometheusOperator:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 200Mi }

        prometheus:
          prometheusSpec:
            retention: 12h
            scrapeInterval: 60s
            evaluationInterval: 60s
            # Discover ServiceMonitors/PodMonitors from all namespaces, not just
            # those carrying this release's Helm label.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 900Mi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi

        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }

        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }

        grafana:
          enabled: true
          # Pin a stable Grafana. The chart's default 13.2.x thrashes on its new
          # unified-storage / "secure values" subsystem on this cluster (18s
          # requests -> liveness kills the pod -> restart loop -> Traefik returns
          # "no available server"). 12.x does not have that subsystem enabled.
          image:
            tag: "12.4.9"
          defaultDashboardsEnabled: true
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          # The chart's default readiness timeout is 1s, which flaps under load.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          persistence:
            enabled: false
          # Telegram bot token for the alert contact point, injected from the
          # grafana-telegram Secret (out-of-band, op://ai-skills/wq2n2roohzy3aqod22tecundri).
          envValueFrom:
            TELEGRAM_BOTTOKEN:
              secretKeyRef:
                name: grafana-telegram
                key: bottoken
          # Move the bundled kube-prometheus-stack (mixin) dashboards out of
          # General into their own folder.
          sidecar:
            dashboards:
              provider:
                folder: "Kubernetes / Mixin"
          grafana.ini:
            server:
              root_url: https://grafana-k8s.kiitconsulting.com
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts:
              - grafana-k8s.kiitconsulting.com
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana-k8s.kiitconsulting.com
          # Kubernetes dashboards imported from grafana.com by ID, split into
          # folders. The chart sidecar auto-provisions the "Prometheus" datasource.
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: k8s-views
                  orgId: 1
                  folder: "Kubernetes / Views"
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/k8s-views
                - name: nodes
                  orgId: 1
                  folder: "Nodes"
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/nodes
          dashboards:
            k8s-views:
              k8s-views-global: { gnetId: 15757, revision: 43, datasource: Prometheus }
              k8s-views-nodes: { gnetId: 15759, revision: 40, datasource: Prometheus }
              k8s-views-pods: { gnetId: 15760, revision: 39, datasource: Prometheus }
            nodes:
              node-exporter-full: { gnetId: 1860, revision: 45, datasource: Prometheus }
          # Grafana-managed alerting: Telegram contact point + policy + rules.
          alerting:
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: Telegram
                  receivers:
                    - uid: telegram-kiit
                      type: telegram
                      disableResolveMessage: false
                      settings:
                        bottoken: $__env{TELEGRAM_BOTTOKEN}
                        chatid: "194219638"
                        parse_mode: HTML
                        # Handsome HTML message. The Grafana `{{ }}` template is
                        # wrapped in a Helm backtick raw-string so the chart's tpl
                        # pass-through leaves it literal (Grafana renders it).
                        message: |
                          {{ `{{ if eq .Status "firing" }}🔥 <b>FIRING</b> · {{ len .Alerts.Firing }} alert(s){{ else }}✅ <b>RESOLVED</b>{{ end }}{{ if .CommonLabels.grafana_folder }}  ·  <i>{{ .CommonLabels.grafana_folder }}</i>{{ end }}
                          {{ range .Alerts }}
                          {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} <b>{{ .Labels.alertname }}</b>{{ if .Labels.severity }} · {{ .Labels.severity }}{{ end }}
                          {{ if .Annotations.description }}{{ .Annotations.description }}
                          {{ else if .Annotations.summary }}{{ .Annotations.summary }}
                          {{ end }}{{ if .Labels.namespace }}📦 <code>{{ .Labels.namespace }}{{ if .Labels.pod }}/{{ .Labels.pod }}{{ end }}</code>
                          {{ end }}{{ if .Labels.instance }}🖥 <code>{{ .Labels.instance }}</code>
                          {{ end }}{{ if .Values }}📊 <code>{{ range $k, $v := .Values }}{{ $k }}={{ $v }} {{ end }}</code>
                          {{ end }}🕐 {{ .StartsAt.Format "15:04 MST" }}
                          {{ end }}` }}
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: Telegram
                  group_by: ["grafana_folder", "alertname"]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
            rules.yaml:
              apiVersion: 1
              groups:
                - orgId: 1
                  name: node-alerts
                  folder: "Kubernetes / Nodes"
                  interval: 1m
                  rules:
                    - uid: kps-node-cpu
                      title: Node CPU utilization high
                      condition: C
                      for: 5m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: warning }
                      annotations: { summary: High node CPU, description: "Node CPU utilization is above 85% (see the alert's instance label)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [85] } }] }
                    - uid: kps-node-mem
                      title: Node memory utilization high
                      condition: C
                      for: 5m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: warning }
                      annotations: { summary: High node memory, description: "Node memory utilization is above 90% (see the alert's instance label)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: '100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [90] } }] }
                    - uid: kps-node-disk
                      title: Node disk space low (root fs)
                      condition: C
                      for: 10m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: warning }
                      annotations: { summary: Low node disk, description: "Root filesystem usage is above 85% (see the alert's instance label)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: '100 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} * 100)' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [85] } }] }
                    - uid: kps-node-notready
                      title: Node not ready
                      condition: C
                      for: 5m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: critical }
                      annotations: { summary: Node NotReady, description: "A node has not been Ready for 5m (see the alert's node label)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: 'sum by(node) (kube_node_status_condition{condition="Ready",status="true"})' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: lt, params: [1] } }] }
                    - uid: kps-node-oom
                      title: Node OOM kills detected
                      condition: C
                      for: 2m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: critical }
                      annotations: { summary: Node OOM kills, description: "The kernel OOM-killed one or more processes in the last 10m" }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 900, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: 'sum (increase(node_vmstat_oom_kill[10m]))' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [0] } }] }
                - orgId: 1
                  name: workload-alerts
                  folder: "Kubernetes / Workloads"
                  interval: 1m
                  rules:
                    - uid: kps-pod-crashloop
                      title: Pod crash looping
                      condition: C
                      for: 5m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: warning }
                      annotations: { summary: Pod crash looping, description: "A container restarted more than 3 times in 15m (see namespace/pod/container labels)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 900, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: 'max by(namespace,pod,container) (increase(kube_pod_container_status_restarts_total[15m]))' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [3] } }] }
                    - uid: kps-container-oom
                      title: Container OOMKilled
                      condition: C
                      for: 1m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: critical }
                      annotations: { summary: Container OOMKilled, description: "A container was OOMKilled (see namespace/pod/container labels)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: 'max by(namespace,pod,container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"})' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [0] } }] }
                    - uid: kps-pod-notready
                      title: Pod not ready (prolonged)
                      condition: C
                      for: 15m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: warning }
                      annotations: { summary: Pod not ready, description: "A pod has been Pending/Unknown for 15m (see namespace/pod labels)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: 'max by(namespace,pod) (kube_pod_status_phase{phase=~"Pending|Unknown"})' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [0] } }] }
                    - uid: kps-deploy-mismatch
                      title: Deployment replicas mismatch
                      condition: C
                      for: 15m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: warning }
                      annotations: { summary: Deployment replicas mismatch, description: "A deployment has fewer available replicas than desired for 15m (see namespace/deployment labels)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: 'max by(namespace,deployment) (kube_deployment_spec_replicas - kube_deployment_status_replicas_available)' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [0] } }] }
                - orgId: 1
                  name: storage-alerts
                  folder: "Kubernetes / Storage"
                  interval: 1m
                  rules:
                    - uid: kps-pvc-full
                      title: PersistentVolumeClaim almost full
                      condition: C
                      for: 10m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: warning }
                      annotations: { summary: PVC almost full, description: "A PersistentVolumeClaim is above 85% used (see namespace/persistentvolumeclaim labels)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: 'max by(namespace,persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100)' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [85] } }] }
                - orgId: 1
                  name: cluster-alerts
                  folder: "Kubernetes / Cluster"
                  interval: 1m
                  rules:
                    - uid: kps-target-down
                      title: Prometheus target down
                      condition: C
                      for: 5m
                      noDataState: OK
                      execErrState: Error
                      labels: { severity: warning }
                      annotations: { summary: Scrape target down, description: "One or more Prometheus scrape targets are down (see the alert's job label)." }
                      data:
                        - refId: A
                          relativeTimeRange: { from: 600, to: 0 }
                          datasourceUid: prometheus
                          model: { refId: A, editorMode: code, instant: true, range: false, intervalMs: 1000, maxDataPoints: 43200, datasource: { type: prometheus, uid: prometheus }, expr: 'sum by(job) (1 - up)' }
                        - refId: C
                          datasourceUid: __expr__
                          model: { refId: C, type: threshold, expression: A, datasource: { type: __expr__, uid: __expr__ }, conditions: [{ evaluator: { type: gt, params: [0] } }] }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m

# bayes.markets data plane: PostgreSQL, Redis, and ingest - which collects the
# Hyperliquid BTC tape the site's rounds settle on.
# Source for ingest is ikscream/prj-bayes-markets (services/ingest); its CI builds
# the image and writes the tag into manifests/bayes-markets/kustomization.yaml.
# Status page: https://bayes-ingest.kiitconsulting.com
#
# `prune: true` matters on this one: ingest was a Deployment and is now a
# StatefulSet, and the old Deployment is removed by that setting rather than by
# hand. Without it the two would run side by side - two sockets, two writers.
#
# One Application for three workloads, against the usual one-app-one-namespace
# rule, because they are one system: ingest is meaningless without the two stores
# it connects to, and splitting them would mean three tiles that are only ever
# green or red together.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bayes-markets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://forgejo.forgejo.svc.cluster.local:3000/ikscream/argo.kiitconsulting.com.git
    targetRevision: main
    path: manifests/bayes-markets
  destination:
    # **Stockholm, not the local cluster.** Polymarket refuses order submission
    # from a German IP (403, "Trading restricted in your region"), so the node
    # that serves bayes.markets moved to eu-north-1 while Argo CD, the forge, the
    # registry and monitoring stayed here. This is the one Application that
    # points off-box; its cluster credential is the `cluster-stockholm` secret.
    server: https://51.21.10.60:6443
    namespace: bayes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

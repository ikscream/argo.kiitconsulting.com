# Example child Application, discovered by the root app-of-apps.
# Deploys the manifests under manifests/podinfo into the `demo` namespace of the
# same (in-cluster) Kubernetes cluster. Copy this file to add more apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ikscream/argo.kiitconsulting.com.git
    targetRevision: main
    path: manifests/podinfo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
